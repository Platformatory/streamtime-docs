<script>
  // Pages used to be served as /<dir>/<name>.html; they now serve at
  // /<dir>/<name>/. Send old links and bookmarks to the new address.
  (function () {
    var path = window.location.pathname;
    if (/\.html$/.test(path) && !/\/404\.html$/.test(path)) {
      var next = path.replace(/\/index\.html$/, "/").replace(/\.html$/, "/");
      window.location.replace(next + window.location.search + window.location.hash);
    }
  })();
</script>
